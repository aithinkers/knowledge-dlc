name: Release matrix

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.cell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: ubuntu-node22, os: ubuntu-latest, node: 22.23.2}
          - {cell: ubuntu-node24, os: ubuntu-latest, node: 24.5.0}
          - {cell: windows-node22, os: windows-latest, node: 22.23.2}
          - {cell: windows-node24, os: windows-latest, node: 24.5.0}
          - {cell: macos-node22, os: macos-latest, node: 22.23.2}
          - {cell: macos-node24, os: macos-latest, node: 24.5.0}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.5.1
      - run: npm ci --ignore-scripts
      - run: node scripts/run-release-matrix-cell.mjs --cell ${{ matrix.cell }} --output result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-matrix-${{ matrix.cell }}
          path: result.json
          if-no-files-found: error

  release-matrix:
    name: Release matrix
    if: ${{ always() }}
    needs: [matrix]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.matrix.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.5.0
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-matrix-*
          path: matrix-results
      - run: node scripts/verify-release-matrix.mjs matrix-results
